name: Build APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # needed to publish releases on tags

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # Use the real signing key if it's stored as a secret, so CI builds can
      # update an installed copy. Without it, a temporary key is generated.
      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p signing
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > signing/statusvault.jks
            echo "Using signing key from secrets"
          else
            keytool -genkeypair -keystore signing/statusvault.jks -storepass statusvault -keypass statusvault \
              -alias statusvault -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Status Vault CI"
            echo "::warning::KEYSTORE_BASE64 secret not set — APK signed with a temporary key"
          fi

      - name: Build release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          cp app/build/outputs/apk/release/app-release.apk "StatusVault-v$VERSION.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: StatusVault-apk
          path: StatusVault-v*.apk

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: StatusVault-v*.apk
          generate_release_notes: true
