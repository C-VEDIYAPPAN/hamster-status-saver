name: Build APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # needed to publish releases on tags

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # Use the real signing key if it's stored as a secret, so CI builds can
      # update an installed copy. Without it, a temporary key is generated.
      - name: Prepare signing key
        id: key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p signing
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > signing/statusvault.jks
            echo "Using signing key from secrets"
            echo "real=true" >> "$GITHUB_OUTPUT"
          else
            keytool -genkeypair -keystore signing/statusvault.jks -storepass statusvault -keypass statusvault \
              -alias statusvault -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Status Vault CI"
            echo "::warning::KEYSTORE_BASE64 secret not set — APK signed with a temporary key (no Release will be published)"
            echo "real=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build release APK
        id: build
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          cp app/build/outputs/apk/release/app-release.apk "StatusVault-v$VERSION.apk"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: StatusVault-apk
          path: StatusVault-v*.apk

      # Every push to main (or a v* tag) publishes / updates the Release for the app's version,
      # e.g. v2.6 — the tag is created by the release itself, so nobody has to push tags by hand.
      - name: Publish release
        # Only publish builds signed with the real key: the app's updater only accepts those anyway.
        if: steps.key.outputs.real == 'true' && github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.build.outputs.version }}
          name: Status Vault v${{ steps.build.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: StatusVault-v*.apk
          generate_release_notes: true
          make_latest: true
